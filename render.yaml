# CoachPlus — Render Blueprint Configuration
# Deploy backend + AI service together via Blueprint.
# Frontend is deployed manually as a Render Static Site (see RENDER_DEPLOY.md).
# Build/start commands run from repo root — use full paths for subdirectories.

services:
  # ── 1. AI Analysis Service ───────────────────────────────────────────────
  - type: web
    name: coachplus-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r ai-service/requirements.txt
    startCommand: cd ai-service && uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  # ── 2. Backend API ───────────────────────────────────────────────────────
  - type: web
    name: coachplus-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANALYSIS_SERVICE_URL
        fromService:
          name: coachplus-ai
          type: web
          property: host
          valueSuffix: /analyze
      - key: COACHPLUS_SECRET_KEY
        generateValue: true