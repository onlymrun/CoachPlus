# CoachPlus — Render Blueprint Configuration
# Deploy all 3 services with one click using Render Blueprint.
# Deploy order: AI Service → Backend API → Frontend (auto-resolved via fromService)

services:
  # ── 1. AI Analysis Service ───────────────────────────────────────────────
  - type: web
    name: coachplus-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false  # User sets this manually for real AI analysis; mock mode works without it

  # ── 2. Backend API ───────────────────────────────────────────────────────
  - type: web
    name: coachplus-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANALYSIS_SERVICE_URL
        fromService:
          name: coachplus-ai
          type: web
          property: host
          valueSuffix: /analyze
      - key: COACHPLUS_SECRET_KEY
        generateValue: true

  # ── 3. Frontend Static Site ─────────────────────────────────────────────
  - type: static_site
    name: coachplus-frontend
    buildCommand: npm run build
    publishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: coachplus-api
          type: web
          property: host