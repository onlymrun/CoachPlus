# CoachPlus — Render Blueprint Configuration
# Deploy backend + AI service together. Frontend is deployed separately
# as a Render Static Site (see RENDER_DEPLOY.md).
services:
  # ── 1. AI Analysis Service ───────────────────────────────────────────────
  - type: web
    name: coachplus-ai
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: OPENAI_API_KEY
        sync: false

  # ── 2. Backend API ───────────────────────────────────────────────────────
  - type: web
    name: coachplus-api
    runtime: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: ANALYSIS_SERVICE_URL
        fromService:
          name: coachplus-ai
          type: web
          property: host
          valueSuffix: /analyze
      - key: COACHPLUS_SECRET_KEY
        generateValue: true